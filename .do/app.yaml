# DigitalOcean App Platform spec for the Shadow Model Evaluator.
#
# Deploy / update:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Secrets (MODEL_ACCESS_KEY) must NOT be committed in plaintext. Either:
#   - leave the placeholder here and set the real value once in the Control Panel
#     (Settings -> Component -> Environment Variables -> Encrypt), or
#   - run: doctl apps update <APP_ID> --spec .do/app.yaml after replacing the value;
#     App Platform rewrites it to EV[1:...] ciphertext on first deploy.
name: shadow-model-evaluator
region: nyc

services:
  - name: api
    # Build from the repo's Dockerfile (CMD runs on port 8000).
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: srikrishna0130/Digital-Ocean-interview-Shadow-model-llm-evaluator
      branch: main
      deploy_on_push: true

    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb

    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

      # Candidate (shadow) model — DigitalOcean Serverless Inference
      - key: CANDIDATE_BASE_URL
        scope: RUN_TIME
        value: https://inference.do-ai.run/v1
      - key: CANDIDATE_MODEL
        scope: RUN_TIME
        value: openai-gpt-5-mini
      - key: CANDIDATE_TIMEOUT_S
        scope: RUN_TIME
        value: "30.0"
      - key: CANDIDATE_MAX_RETRIES
        scope: RUN_TIME
        value: "2"

      # Secret — create under Control Panel: Inference -> Model Access Keys.
      # Replace the placeholder before first deploy (or set it in the UI).
      - key: MODEL_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_MODEL_ACCESS_KEY
